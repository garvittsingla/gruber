<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gruber</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📬</text></svg>">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="main.js"></script>
</head>
<body>
	<nav></nav>
	<main>
		<section id="editorpane">
			<div class="editor-header">
				<div class="editor-title">Editor</div>
				<div class="editor-toolbar" role="toolbar" aria-label="Insert Markdown">
					<button class="editor-tool-button" type="button" data-insert="slide" title="New slide" aria-label="New slide">＋</button>
					<button class="editor-tool-button" type="button" data-insert="heading" title="Add heading" aria-label="Add heading">H</button>
					<button class="editor-tool-button" type="button" data-insert="code" title="Add code block" aria-label="Add code block">&lt;/&gt;</button>
				</div>
				<span class="editor-language">Markdown</span>
			</div>
			<textarea id="editor" spellcheck="false"></textarea>
			<div class="editor-footer">
				<span>Markdown source</span>
				<span>Gruber</span>
			</div>
		</section>
		<div id="display">
            <div class="displayutility fira-code">
                <div id="slidenumbercontainer"> Slide number : <span class="slidenumber">1</span></div>
                <div id="slidenumbercontoller">
                    <button id="prevslide">&#9664</button>
                    <span><span class="slidenumber">1</span> / <span class="totalnumber">1</span></span>
                    <button id="nextslide">&#9654</button>
                </div>
                <div class="modebuttoncontainer">
                    <button class="modebutton setsingleslideview active">single</button>
                    <button class="modebutton setmultislideview">multi</button>
                </div>
            </div>
		    <div id="displayarea"></div>
		</div>
	</main>
</body>
</html>
